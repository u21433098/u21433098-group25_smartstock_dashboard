# Nginx reverse proxy for SmartStock: serves HTTPS and passes requests to Gunicorn.
# Install (as root), replacing smartstock.example.com with the real address:
#     sudo cp deploy/nginx-smartstock.conf /etc/nginx/sites-available/smartstock
#     sudo ln -s /etc/nginx/sites-available/smartstock /etc/nginx/sites-enabled/
#     sudo certbot --nginx -d smartstock.example.com      (free HTTPS certificate)
#     sudo nginx -t && sudo systemctl reload nginx
# Then set BEHIND_HTTPS_PROXY=1 in /opt/smartstock/.env and: sudo systemctl restart smartstock
server {
    listen 80;
    server_name smartstock.example.com;

    client_max_body_size 1m;          # SmartStock only receives small forms

    # Static files (CSS) straight from disk, without going through Python.
    location /static/ {
        alias /opt/smartstock/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    access_log /var/log/nginx/smartstock.access.log;
    error_log  /var/log/nginx/smartstock.error.log;
}
