{% extends "base.html" %}
{% from "_macros.html" import csrf_input %}
{% block title %}Register{% endblock %}
{% block content %}
<!-- ===== REGISTER PAGE ===== -->
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-1">Create an account</h1>
        <p class="text-muted">Register to use SmartStock.</p>
        <form method="post">
          {{ csrf_input() }}
          <div class="mb-3">
            <label for="name" class="form-label">Full name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ form.name }}"
                   autocomplete="name" required maxlength="80">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ form.email }}"
                   autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="new-password" minlength="8" required aria-describedby="pwHelp">
            <div id="pwHelp" class="form-text">At least 8 characters.</div>
          </div>
          <div class="mb-3">
            <label for="confirm" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="confirm" name="confirm"
                   autocomplete="new-password" minlength="8" required>
          </div>
          <button type="submit" class="btn btn-ss w-100">Create account</button>
        </form>
        <p class="mt-3 mb-0 small">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
