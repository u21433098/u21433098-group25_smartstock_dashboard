{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<!-- ===== GENERIC ERROR PAGE ===== -->
<div class="text-center py-5">
  <h1 class="display-5">Error {{ code }}</h1>
  <p class="lead">{{ message }}</p>
  <a class="btn btn-ss" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}">Go back home</a>
</div>
{% endblock %}
