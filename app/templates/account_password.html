{% extends "base.html" %}
{% from "_macros.html" import csrf_input %}
{% block title %}Change password{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-1">Change your password</h1>
        <p class="text-muted">Logged in as {{ current_user.name }} ({{ current_user.email }}).</p>
        <form method="post">
          {{ csrf_input() }}
          <div class="mb-3">
            <label for="current_password" class="form-label">Current password</label>
            <input type="password" class="form-control" id="current_password" name="current_password"
                   autocomplete="current-password" required autofocus>
          </div>
          <div class="mb-3">
            <label for="new_password" class="form-label">New password</label>
            <input type="password" class="form-control" id="new_password" name="new_password"
                   autocomplete="new-password" minlength="8" required aria-describedby="pwHelp">
            <div id="pwHelp" class="form-text">At least 8 characters.</div>
          </div>
          <div class="mb-3">
            <label for="confirm" class="form-label">Confirm new password</label>
            <input type="password" class="form-control" id="confirm" name="confirm"
                   autocomplete="new-password" minlength="8" required>
          </div>
          <button type="submit" class="btn btn-ss w-100">Change password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
