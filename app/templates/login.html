{% extends "base.html" %}
{% from "_macros.html" import csrf_input %}
{% block title %}Log in{% endblock %}
{% block content %}
<!-- ===== LOGIN PAGE ===== -->
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-1">Welcome back</h1>
        <p class="text-muted">Log in to manage your vending stock.</p>
        <form method="post" novalidate>
          {{ csrf_input() }}
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ email }}"
                   autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-ss w-100">Log in</button>
        </form>
        <p class="mt-3 mb-0 small">No account yet? <a href="{{ url_for('auth.register') }}">Register here</a>.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
